name: PR Check

on:
  pull_request:
    branches:
      - main
  # Also on main, so main saves the ESLint and tool caches that PRs fall back to.
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checks
        uses: https://git.kodu.lenn.uk/websites/ci-actions/pnpm-checks@5c12cfef32163ae126938a8682eaadc1e0146d20 # v1.2.5

      - name: Scan code
        uses: https://git.kodu.lenn.uk/websites/ci-actions/opengrep-scan@5c12cfef32163ae126938a8682eaadc1e0146d20 # v1.2.5
