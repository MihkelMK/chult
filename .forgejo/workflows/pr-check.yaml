name: PR Check

on:
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create .env for type checking
        run: '[ -f .env.example ] && cp .env.example .env || true'

      - name: Type check
        run: pnpm check

      - name: Audit dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Install opengrep
        run: |
          # Release binary + checksum instead of `curl | bash`: the upstream install.sh
          # is served from the default branch, so it is unpinned code running in CI.
          # Upstream publishes no checksums file, so OPENGREP_SHA256 is pinned by hand.
          # Renovate bumps OPENGREP_VERSION only. When it does, this step fails at
          # `sha256sum -c` until the hash is updated too. That is deliberate: fail closed.
          # renovate: datasource=github-releases depName=opengrep/opengrep
          OPENGREP_VERSION=v1.29.0
          OPENGREP_SHA256=40c21299eeddabf743b856daa843d24f9d4a027130671cd45b3b21776fd9ab26
          # Installed under $HOME: the runner is not root, so /usr/local/bin is not writable
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/opengrep" \
            "https://github.com/opengrep/opengrep/releases/download/${OPENGREP_VERSION}/opengrep_manylinux_x86"
          echo "${OPENGREP_SHA256}  $HOME/.local/bin/opengrep" | sha256sum -c -
          chmod +x "$HOME/.local/bin/opengrep"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Scan code
        run: opengrep scan --error --config p/javascript --config p/typescript --config p/secrets --config p/nodejsscan --config p/supply-chain .
