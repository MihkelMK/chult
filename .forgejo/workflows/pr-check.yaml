name: PR Check

on:
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6
        with:
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create .env for type checking
        run: '[ -f .env.example ] && cp .env.example .env || true'

      - name: Type check
        run: pnpm check

      - name: Audit dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Scan code
        run: opengrep scan --config p/javascript --config p/typescript --config p/secrets --config p/nodejsscan --config p/supply-chain .
