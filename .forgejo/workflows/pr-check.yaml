name: PR Check

on:
  pull_request:
    branches:
      - main
  # Also on main, so main saves the ESLint and tool caches that PRs fall back to.
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checks
        uses: https://git.kodu.lenn.uk/websites/ci-actions/pnpm-checks@f202f4c9f83721591605cc12edff14ffd635b961 # v1.2.4

      - name: Scan code
        uses: https://git.kodu.lenn.uk/websites/ci-actions/opengrep-scan@f202f4c9f83721591605cc12edff14ffd635b961 # v1.2.4
