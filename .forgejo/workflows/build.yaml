name: Build and Deploy

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

env:
  DOCKER_HOST: tcp://dind:2375

jobs:
  build:
    runs-on: build
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: git.kodu.lenn.uk
          username: ${{ vars.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Generate image metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: git.kodu.lenn.uk/websites/chult_web
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          driver: docker

      - name: Build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PUBLIC_MAX_IMAGE_SIZE=52428800

      - name: Install trivy
        run: |
          # Release tarball + checksum instead of aquasecurity/trivy-action: that action
          # installs the binary through a nested composite action, and its $GITHUB_PATH
          # export does not reach later steps on this runner, so the scan died with
          # "trivy: command not found".
          # Upstream does publish trivy_<version>_checksums.txt, but the hash is pinned
          # here by hand. Renovate bumps TRIVY_VERSION only. When it does, this step fails
          # at `sha256sum -c` until the hash is updated too. That is deliberate: fail closed.
          # renovate: datasource=github-releases depName=aquasecurity/trivy
          TRIVY_VERSION=v0.73.0
          TRIVY_SHA256=2edd39da482bb4e9831962487b68f68e3928ec3137794757f54d00383d79547b
          # Installed under $HOME: the runner is not root, so /usr/local/bin is not writable
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}/trivy_${TRIVY_VERSION#v}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  /tmp/trivy.tar.gz" | sha256sum -c -
          tar -xzf /tmp/trivy.tar.gz -C "$HOME/.local/bin" trivy
          rm -f /tmp/trivy.tar.gz
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache trivy vulnerability database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}/.cache/trivy
          # The run id never hits, so every run restores the newest cache through
          # restore-keys and then saves the DB back under a fresh key. Trivy refreshes a
          # stale DB itself, so a restored old cache costs a download, never a stale scan.
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-

      - name: Scan image
        env:
          IMAGE_REF: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
        run: |
          trivy image \
            --format table \
            --exit-code 1 \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            "$IMAGE_REF"

      - name: Push image
        run: echo "${{ steps.meta.outputs.tags }}" | xargs -r -n1 docker push

      - name: Trigger prod deploy
        if: github.ref == 'refs/heads/main'
        env:
          KOMODO_SECRET: ${{ secrets.KOMODO_WEBHOOK_SECRET }}
        run: |
          curl -fsS -X POST "${{ vars.KOMODO_DEPLOY_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -H "X-Gitlab-Token: ${KOMODO_SECRET}" \
            -d '{"ref":"${{ github.ref }}"}'

      - name: Trigger dev deploy
        if: github.ref == 'refs/heads/dev'
        env:
          KOMODO_SECRET: ${{ secrets.KOMODO_WEBHOOK_SECRET }}
        run: |
          curl -fsS -X POST "${{ vars.KOMODO_DEV_DEPLOY_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -H "X-Gitlab-Token: ${KOMODO_SECRET}" \
            -d '{"ref":"${{ github.ref }}"}'
