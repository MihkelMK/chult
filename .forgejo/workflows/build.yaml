name: Build and Deploy

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

env:
  DOCKER_HOST: tcp://dind:2375

jobs:
  build:
    runs-on: build
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build, scan and push
        uses: https://git.kodu.lenn.uk/websites/ci-actions/docker-build-scan-push@510ce98f814d61cb58cc411c171c216db04c9f07 # 1.2.6
        with:
          image: git.kodu.lenn.uk/websites/chult_web
          username: ${{ vars.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,format=short
          build-args: |
            PUBLIC_MAX_IMAGE_SIZE=52428800
            APK_CACHE_BUST=${{ github.run_id }}

      - name: Trigger prod deploy
        if: github.ref == 'refs/heads/main'
        uses: https://git.kodu.lenn.uk/websites/ci-actions/komodo-deploy@510ce98f814d61cb58cc411c171c216db04c9f07 # 1.2.6
        with:
          webhook: ${{ vars.KOMODO_DEPLOY_WEBHOOK }}
          secret: ${{ secrets.KOMODO_WEBHOOK_SECRET }}

      - name: Trigger dev deploy
        if: github.ref == 'refs/heads/dev'
        uses: https://git.kodu.lenn.uk/websites/ci-actions/komodo-deploy@510ce98f814d61cb58cc411c171c216db04c9f07 # 1.2.6
        with:
          webhook: ${{ vars.KOMODO_DEV_DEPLOY_WEBHOOK }}
          secret: ${{ secrets.KOMODO_WEBHOOK_SECRET }}
