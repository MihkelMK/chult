name: Build and Deploy

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

env:
  DOCKER_HOST: tcp://dind:2375

jobs:
  build:
    runs-on: build
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: git.kodu.lenn.uk
          username: ${{ vars.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Generate image metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: git.kodu.lenn.uk/websites/chult_web
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver: docker

      - name: Build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PUBLIC_MAX_IMAGE_SIZE=52428800
            APK_CACHE_BUST=${{ github.run_id }}

      - name: Scan image
        uses: https://git.kodu.lenn.uk/websites/ci-actions/trivy-scan@7289523eb0815594149a25a26f0fe62a27323a7e # v1.0.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}

      - name: Push image
        run: echo "${{ steps.meta.outputs.tags }}" | xargs -r -n1 docker push

      - name: Trigger prod deploy
        if: github.ref == 'refs/heads/main'
        env:
          KOMODO_SECRET: ${{ secrets.KOMODO_WEBHOOK_SECRET }}
        run: |
          curl -fsS -X POST "${{ vars.KOMODO_DEPLOY_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -H "X-Gitlab-Token: ${KOMODO_SECRET}" \
            -d '{"ref":"${{ github.ref }}"}'

      - name: Trigger dev deploy
        if: github.ref == 'refs/heads/dev'
        env:
          KOMODO_SECRET: ${{ secrets.KOMODO_WEBHOOK_SECRET }}
        run: |
          curl -fsS -X POST "${{ vars.KOMODO_DEV_DEPLOY_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -H "X-Gitlab-Token: ${KOMODO_SECRET}" \
            -d '{"ref":"${{ github.ref }}"}'
