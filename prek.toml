# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json
#
# The other websites repos have the same file, except for the two lines marked below, which only
# this repo has. Change them together.

# ============================================================================
# VALIDATE PREK CONFIG ITSELF
# ============================================================================

[[repos]]
repo = "meta"
hooks = [{ id = "check-useless-excludes" }, { id = "check-hooks-apply" }]

# ============================================================================
# CHECKS
# ============================================================================

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-added-large-files" },
  { id = "check-merge-conflict" },
  { id = "detect-private-key" },
  { id = "fix-byte-order-marker" },   # Removes UTF-8 byte order marker
  { id = "check-toml" },
]

[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "no-commit-to-branch"
args = ["--branch", "main"]
[[repos.hooks]]
id = "end-of-file-fixer" # Ensures that a file is either empty, or ends with one newline.
exclude = '^drizzle/'    # Generated by drizzle-kit without the newline
[[repos.hooks]]
id = "check-yaml"
args = ["--allow-multiple-documents"]
[[repos.hooks]]
id = "trailing-whitespace"             # Trims trailing whitespace
args = ["--markdown-linebreak-ext=md"] # Preserve Markdown hard line breaks
[[repos.hooks]]
id = "mixed-line-ending" # Ensure UNIX style line endings
args = ["--fix=lf"]

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "83d9cd684c87d95d656c1458ef04895a7f1cbd8e" # frozen: v8.30.1
hooks = [{ id = "gitleaks" }]

# ============================================================================
# LINT, FORMAT AND TYPE CHECK
# Shared with the other websites repos, see https://git.kodu.lenn.uk/websites/prek-hooks.
# Prettier goes after eslint, because eslint --fix can undo the formatting.
# ============================================================================

[[repos]]
repo = "https://git.kodu.lenn.uk/websites/prek-hooks"
rev = "674050c0318225b2e8b50ecbab787a1160b9fbac" # frozen: v1.0.0
hooks = [{ id = "eslint" }, { id = "prettier" }, { id = "pnpm-check" }]
